services:
  server:
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - patient-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  patient-data:
